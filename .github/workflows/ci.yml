name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Regenerate app assets
        run: make assets

      - name: Verify generated assets are committed
        run: git diff --exit-code BridgeFlow/Assets.xcassets

      - name: Run tests
        run: make test

      - name: Build app
        run: make check build

      - name: Package app bundle
        run: make package

      - name: Upload app bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: BridgeFlow.app
          path: dist/BridgeFlow.app
          if-no-files-found: error

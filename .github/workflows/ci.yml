name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Verify app assets are present
        run: |
          test -f BridgeFlow/Assets.xcassets/AppIcon.appiconset/icon_1024x1024.png
          test -f BridgeFlow/Assets.xcassets/BridgeFlowIcon.imageset/bridgeflow-icon.png

      - name: Run tests
        run: make test

      - name: Build app
        run: make check build

      - name: Package app bundle
        run: make package

      - name: Upload app bundle artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: BridgeFlow.app
          path: dist/BridgeFlow.app
          if-no-files-found: error
